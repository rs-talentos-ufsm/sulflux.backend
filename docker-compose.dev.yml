services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ${PROJECT_NAME}-backend-dev
    image: ${PROJECT_NAME}_backend_dev
    env_file:
      - ./.env.development
    ports:
      - '${BACKEND_PORT:-5001}:${BACKEND_PORT:-5001}'
    volumes:
      - .:/app
      - /app/node_modules
      - ../../packages/shared:/app/node_modules/@lib/shared
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      project_network:
        aliases:
          - backend

  db:
    container_name: ${PROJECT_NAME}_db_dev
    ports:
      - '${DB_PORT:-5434}:5432'
    networks:
      - project_network

  minio:
    container_name: ${PROJECT_NAME}_minio_dev
    ports:
      - '${MINIO_API_PORT:-9005}:9000'
      - '${MINIO_CONSOLE_PORT:-9021}:9001'
    networks:
      - project_network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ${PROJECT_NAME}_jaeger_dev
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '${JAEGER_PORT:-16687}:16686' # Interface UI do Jaeger
      - '${OTLP_GRPC_PORT:-4319}:4317' # Porta OTLP gRPC
      - '${OTLP_HTTP_PORT:-4320}:4318' # Porta OTLP HTTP
    networks:
      - project_network

networks:
  project_network:
    name: '${PROJECT_NAME}_network'
    external: true
